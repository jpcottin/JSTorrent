name: System Bridge CI

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'packages/**'
      - '.github/workflows/system-bridge-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'packages/**'
      - '.github/workflows/system-bridge-ci.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: desktop

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --exclude jstorrent-desktop -- -D warnings

      - name: Build io-daemon for integration tests
        run: cargo build -p jstorrent-io-daemon

      - name: Run tests
        run: cargo test --workspace --exclude jstorrent-desktop
