name: Tauri App CI

on:
  push:
    branches: [main]
    tags:
      - 'tauri-app-v*'
    paths:
      - 'desktop/**'
      - 'packages/**'
      - '.github/workflows/tauri-app-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'packages/**'
      - '.github/workflows/tauri-app-ci.yml'

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            rust_target: ''
          - platform: windows-latest
            args: ''
            rust_target: ''

    runs-on: ${{ matrix.platform }}

    env:
      HAS_MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
      HAS_MACOS_NOTARIZATION: ${{ secrets.ASC_API_KEY_P8_BASE64 != '' }}
      HAS_WINDOWS_SIGNING: ${{ secrets.AZURE_CLIENT_SECRET != '' }}

    steps:
      - uses: actions/checkout@v4

      # --- Node.js + pnpm ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # --- Rust ---
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop -> target'

      # --- Linux system dependencies ---
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      # --- macOS code signing ---
      - name: Set up macOS code signing keychain
        if: matrix.platform == 'macos-latest' && env.HAS_MACOS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          echo "Available signing identities:"
          security find-identity -v -p codesigning build.keychain
          rm -f certificate.p12

      - name: Set up macOS notarization credentials
        if: matrix.platform == 'macos-latest' && env.HAS_MACOS_NOTARIZATION == 'true'
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > ~/private_keys/AuthKey_${ASC_API_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${ASC_API_KEY_ID}.p8

      # --- Windows signing tool ---
      - name: Install trusted-signing-cli
        if: matrix.platform == 'windows-latest' && env.HAS_WINDOWS_SIGNING == 'true'
        run: cargo install trusted-signing-cli

      # --- Build sidecars ---
      - name: Build sidecars
        shell: bash
        working-directory: desktop
        run: |
          if [ -n "${{ matrix.rust_target }}" ]; then
            TARGET="${{ matrix.rust_target }}"
            cargo build --release -p jstorrent-host --target "$TARGET"
            cargo build --release -p jstorrent-io-daemon --target "$TARGET"
            mkdir -p tauri-app/src-tauri/binaries
            if [[ "$TARGET" == *"windows"* ]]; then
              cp "target/$TARGET/release/jstorrent-host.exe" "tauri-app/src-tauri/binaries/jstorrent-host-$TARGET.exe"
              cp "target/$TARGET/release/jstorrent-io-daemon.exe" "tauri-app/src-tauri/binaries/jstorrent-io-daemon-$TARGET.exe"
            else
              cp "target/$TARGET/release/jstorrent-host" "tauri-app/src-tauri/binaries/jstorrent-host-$TARGET"
              cp "target/$TARGET/release/jstorrent-io-daemon" "tauri-app/src-tauri/binaries/jstorrent-io-daemon-$TARGET"
            fi
          else
            TRIPLE="$(rustc --print host-tuple)"
            cargo build --release -p jstorrent-host
            cargo build --release -p jstorrent-io-daemon
            mkdir -p tauri-app/src-tauri/binaries
            if [ "${{ matrix.platform }}" = "windows-latest" ]; then
              cp "target/release/jstorrent-host.exe" "tauri-app/src-tauri/binaries/jstorrent-host-$TRIPLE.exe"
              cp "target/release/jstorrent-io-daemon.exe" "tauri-app/src-tauri/binaries/jstorrent-io-daemon-$TRIPLE.exe"
            else
              cp "target/release/jstorrent-host" "tauri-app/src-tauri/binaries/jstorrent-host-$TRIPLE"
              cp "target/release/jstorrent-io-daemon" "tauri-app/src-tauri/binaries/jstorrent-io-daemon-$TRIPLE"
            fi
          fi

      # --- Install frontend dependencies ---
      - name: Install frontend dependencies
        run: pnpm install

      # --- Build Tauri app ---
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing (Tauri reads these automatically)
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "${{ matrix.platform == 'macos-latest' && 'Developer ID Application: Kyle Graehl (VD7BYQ6ABM)' || '' }}"
          # macOS notarization
          APPLE_API_KEY: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          APPLE_API_ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          # Windows signing (for trusted-signing-cli)
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          projectPath: desktop/tauri-app
          tauriScript: pnpm tauri
          tagName: tauri-app-v__VERSION__
          releaseName: 'JSTorrent Desktop v__VERSION__'
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonKeepUniversal: true
          args: >-
            ${{ matrix.args }}
            ${{ matrix.platform == 'windows-latest' && secrets.AZURE_CLIENT_SECRET != '' && '--config ''{"bundle":{"windows":{"signCommand":"trusted-signing-cli -e https://eus.codesigning.azure.net -a kylegraehl -c jstorrent-profile %1"}}}''' || '' }}

      # --- Cleanup ---
      - name: Clean up macOS keychain
        if: matrix.platform == 'macos-latest' && always()
        run: |
          security delete-keychain build.keychain 2>/dev/null || true
          rm -rf ~/private_keys 2>/dev/null || true
