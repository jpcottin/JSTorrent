name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
    tags:
      - 'website-v*'
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: Fetch latest system-bridge release
        id: bridge-release
        run: |
          TAG=$(gh release list --json tagName -q '[.[] | select(.tagName | startswith("system-bridge-v"))][0].tagName // empty')
          if [ -n "$TAG" ]; then
            echo "tag=${TAG#system-bridge-}" >> $GITHUB_OUTPUT
            echo "Found latest system-bridge release: $TAG"
          else
            echo "tag=v0.1.12" >> $GITHUB_OUTPUT
            echo "No system-bridge release found, using fallback"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch latest tauri-app release
        id: tauri-release
        run: |
          TAG=$(gh release list --json tagName -q '[.[] | select(.tagName | startswith("tauri-app-v"))][0].tagName // empty')
          if [ -n "$TAG" ]; then
            echo "tag=${TAG#tauri-app-}" >> $GITHUB_OUTPUT
            echo "Found latest tauri-app release: $TAG"
          else
            echo "tag=v0.1.14" >> $GITHUB_OUTPUT
            echo "No tauri-app release found, using fallback"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Website
        run: |
          cd website
          pnpm run build
        env:
          VITE_SYSTEM_BRIDGE_TAG: ${{ steps.bridge-release.outputs.tag }}
          VITE_TAURI_APP_TAG: ${{ steps.tauri-release.outputs.tag }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'website/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
