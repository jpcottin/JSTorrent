name: JSTorrent
options:
  minimumXcodeGenVersion: 2.38.0
  bundleIdPrefix: com.jstorrent
packages:
  JSTorrentKit:
    path: JSTorrentKit
targets:
  JSTorrent:
    type: application
    platform: iOS
    deploymentTarget: '16.0'
    sources:
      - path: JSTorrent/App
      - path: JSTorrent/Resources/Assets.xcassets
        buildPhase: resources
      - path: JSTorrent/Resources/Localization
        buildPhase: resources
      - path: JSTorrent/Resources/engine.bundle.js
        buildPhase: resources
      - path: JSTorrent/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: JSTorrentKit
        product: JSTorrentKit
    preBuildScripts:
      - name: Sync Engine Bundle
        inputFiles:
          - ${SRCROOT}/scripts/sync-engine-bundle.sh
          - ${SRCROOT}/../packages/engine/dist/engine.native.js
        outputFiles:
          - ${SRCROOT}/JSTorrent/Resources/engine.bundle.js
        script: |
          if [ -x "${SRCROOT}/scripts/sync-engine-bundle.sh" ]; then
            "${SRCROOT}/scripts/sync-engine-bundle.sh"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jstorrent.ios
        PRODUCT_NAME: JSTorrent
        SWIFT_VERSION: 5.10
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: JSTorrent/Info.plist
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: '1,2'
        MARKETING_VERSION: '1.0.7'
        CURRENT_PROJECT_VERSION: '9'
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: 'Apple Distribution'
        PROVISIONING_PROFILE_SPECIFIER: 'JSTorrent iOS Distribution'
        DEVELOPMENT_TEAM: VD7BYQ6ABM
  JSTorrentAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '16.0'
    sources:
      - path: JSTorrentAppTests
    dependencies:
      - package: JSTorrentKit
        product: JSTorrentKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jstorrent.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.10
schemes:
  JSTorrent:
    build:
      targets:
        JSTorrent: all
        JSTorrentAppTests: [test]
    test:
      targets:
        - JSTorrentAppTests
